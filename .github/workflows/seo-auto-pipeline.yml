name: SEO Opportunity Signals

# Every other day at 04:00 UTC (= 12:00 Asia/Shanghai)
#
# The scheduled workflow only gathers SEO signals. It never generates article
# drafts, builds, deploys, submits IndexNow, or changes a production release.
#
# Optional secrets (script skips gracefully if missing):
#   GSC_SERVICE_ACCOUNT_JSON   (raw JSON of a service account with GSC access)
#   INDEXNOW_KEY               (if not committed in repo)

on:
  schedule:
    - cron: '0 4 */2 * *'
  workflow_dispatch:
    inputs:
      maxNew:
        description: 'Max new articles to generate'
        required: false
        default: '1'
      maxRefresh:
        description: 'Max old articles to refresh'
        required: false
        default: '3'
      competitors:
        description: 'Comma-separated competitor domains'
        required: false
        default: 'outequippro.com'

permissions:
  contents: read

concurrency:
  group: seo-auto-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PIPELINE_MAX_NEW: ${{ github.event.inputs.maxNew || '1' }}
      PIPELINE_MAX_REFRESH: ${{ github.event.inputs.maxRefresh || '3' }}
      COMPETITOR_DOMAINS: ${{ github.event.inputs.competitors || 'outequippro.com' }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:cooldrivepro.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: GSC opportunity scan
        run: node scripts/gsc-keyword-opportunities.mjs
        continue-on-error: true

      - name: Competitor keyword scan
        run: node scripts/competitor-keyword-scan.mjs --domains="${COMPETITOR_DOMAINS}"
        continue-on-error: true

      - name: Upload SEO signal results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-pipeline-logs-${{ github.run_id }}
          path: |
            .omc/seo
            logs
          if-no-files-found: ignore
          retention-days: 30

    <script>
      (function () {
        var sendTo = 'AW-18126437861/LTqWCOzCqKQcEOX7rcND';
        var triggered = false;

        function fireConversion() {
          if (triggered || typeof gtag !== 'function') return;
          triggered = true;
          window.__coolDriveProGoogleAdsConversions = window.__coolDriveProGoogleAdsConversions || {};
          if (!window.__coolDriveProGoogleAdsConversions[sendTo]) {
            gtag('event', 'conversion', { 'send_to': sendTo });
            window.__coolDriveProGoogleAdsConversions[sendTo] = true;
          }
        }

        function scanForSuccessMessage() {
          if (triggered || !document.body) return false;
          var divs = document.querySelectorAll('div');
          for (var index = 0; index < divs.length; index += 1) {
            var div = divs[index];
            if (div.textContent && div.textContent.includes('Thank you for reaching out.') && div.offsetParent !== null) {
              fireConversion();
              return true;
            }
          }
          return false;
        }

        window.addEventListener('load', function () {
          if (scanForSuccessMessage() || typeof MutationObserver === 'undefined' || !document.body) return;

          var observer = new MutationObserver(function () {
            if (scanForSuccessMessage()) {
              observer.disconnect();
              clearTimeout(stopTimer);
            }
          });
          var stopTimer = setTimeout(function () {
            observer.disconnect();
          }, 120000);

          observer.observe(document.body, { childList: true, subtree: true, characterData: true });
        });
      })();
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "DefinedTermSet",
      "name": "Parking Air Conditioner Industry Glossary by CoolDrivePro",
      "url": "https://cooldrivepro.com/about",
      "hasDefinedTerm": [
        {
          "@type": "DefinedTerm",
          "name": "Parking Air Conditioner",
          "termCode": "parking-ac",
          "description": "A parking air conditioner (parking AC) is a battery-powered DC air conditioning unit that cools truck cabs, RVs, and vans when the vehicle engine is off. It runs on 12V or 24V DC power from the vehicle battery bank, eliminating engine idling for cooling. Also known as no-idle AC, truck parking cooler, or battery-powered air conditioner."
        },
        {
          "@type": "DefinedTerm",
          "name": "No-Idle Air Conditioner",
          "termCode": "no-idle-ac",
          "description": "A no-idle air conditioner is a parking AC system that allows truck drivers and RV owners to stay cool without running the vehicle engine. No-idle ACs help comply with anti-idling laws, reduce fuel consumption, and lower emissions at truck stops and rest areas."
        },
        {
          "@type": "DefinedTerm",
          "name": "BLDC Compressor",
          "termCode": "bldc-compressor",
          "description": "BLDC (Brushless DC) compressor is the motor technology used in CoolDrivePro parking air conditioners. BLDC compressors are more energy-efficient, quieter, and longer-lasting than traditional piston compressors. They enable variable-speed operation for precise temperature control and extended battery runtime."
        },
        {
          "@type": "DefinedTerm",
          "name": "12V Parking Air Conditioner",
          "termCode": "12v-parking-ac",
          "description": "A 12V parking air conditioner operates on 12-volt DC power from a vehicle battery bank. It is compatible with most RVs, vans, campers, and light trucks. CoolDrivePro 12V parking ACs (VS02 PRO and VX3000SP) support both 12V and 24V input."
        },
        {
          "@type": "DefinedTerm",
          "name": "24V Parking Air Conditioner",
          "termCode": "24v-parking-ac",
          "description": "A 24V parking air conditioner operates on 24-volt DC power, the standard electrical system voltage for semi trucks and heavy commercial vehicles. CoolDrivePro parking ACs support 24V input for direct compatibility with semi truck electrical systems."
        }
      ]
    }
    </script>

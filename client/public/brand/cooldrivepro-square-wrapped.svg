<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title>CoolDrivePro square logo</title>
  <desc>Square blue CoolDrivePro logo with CoolDrive on the top line and Pro on the bottom line in white bold lettering.</desc>
  <rect width="1024" height="1024" fill="#0B4FB3"/>
  <rect x="54" y="54" width="916" height="916" fill="none" stroke="#FFFFFF" stroke-width="28"/>
  <rect x="116" y="116" width="792" height="792" fill="none" stroke="#FFFFFF" stroke-width="12"/>

  <g font-family="Arial Black, Impact, Montserrat, Helvetica, Arial, sans-serif" font-weight="900" text-anchor="middle" fill="#FFFFFF">
    <text x="512" y="410" font-size="120" letter-spacing="0">CoolDrive</text>
    <text x="512" y="760" font-size="252" letter-spacing="4">Pro</text>
  </g>
</svg>

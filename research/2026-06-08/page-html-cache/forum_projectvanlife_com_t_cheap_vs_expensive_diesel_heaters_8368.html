        <div class="hidden" id="data-preloaded" data-preloaded="{&quot;topic_8368&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:23577,\&quot;name\&quot;:null,\&quot;username\&quot;:\&quot;DodgeLife\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/d/90ced4/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-03-30T17:00:30.527Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eJust watched a video where a cheap (under $200 Chinese Copy) is compared to an Espar Diesel heater.\\u003c/p\\u003e\\n\\u003cp\\u003eThe Espar is about $1400 US compared to the Chinese copy about $130 US\\u003c/p\\u003e\\n\\u003cp\\u003eI have 3 Chinese diesel heaters.  I have had only one problem with one of them and that was a poorly made fuel tank, not the heater itself.   I never have any odors of any kind whatsoever from any of them except maybe on initial startup and it’s rare and very slight if at all.\\u003c/p\\u003e\\n\\u003cp\\u003eThey have been 100% reliable and kept me comfortable on some cold winter nights.  I found that my 5Kw unit is too much for my small van even on low.   So I also have a 2Kw unit that seems about perfect even though I still keep a window open slightly on nights down to 10F because it puts out plenty of heat even on low.  I do have custom made window insulation covers and that helps as well.\\u003c/p\\u003e\\n\\u003cp\\u003eMy (opinion) is that if you have trouble with your Chinese diesel heater you either got a bad one and should have returned it early on, or you just don’t quite know how to use it.  I also have buddy heaters and they are good for their purpose but I much prefer the diesel heater in the van for a number of reasons.\\u003c/p\\u003e\\n\\u003cp\\u003eIf the Chinese had not made affordable copies, I would likely have never owned a diesel heater.\\u003cbr\\u003e\\nThe only thing that could make them better for me is if they were made in America for not too much more.\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://forum.projectvanlife.com/uploads/db3517/original/2X/6/6d81e84b299315303e29b2964688ffba2cae429a.jpeg\\\&quot; data-download-href=\\\&quot;https://forum.projectvanlife.com/uploads/db3517/6d81e84b299315303e29b2964688ffba2cae429a\\\&quot; title=\\\&quot;DieselHeaterInVan_20220318_1129181\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://forum.projectvanlife.com/uploads/db3517/original/2X/6/6d81e84b299315303e29b2964688ffba2cae429a.jpeg\\\&quot; alt=\\\&quot;DieselHeaterInVan_20220318_1129181\\\&quot; data-base62-sha1=\\\&quot;fCKmUIoDOVkmmmqbzJlgPOTbYNQ\\\&quot; width=\\\&quot;281\\\&quot; height=\\\&quot;500\\\&quot; data-small-upload=\\\&quot;https://forum.projectvanlife.com/uploads/db3517/optimized/2X/6/6d81e84b299315303e29b2964688ffba2cae429a_2_10x10.png\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\n\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eDieselHeaterInVan_20220318_1129181\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e450×800 33.7 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\n\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-03-30T17:00:30.527Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:11128,\&quot;reads\&quot;:54,\&quot;readers_count\&quot;:53,\&quot;score\&quot;:55685.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4941,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/1\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23581,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-03-30T22:59:23.294Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eThe biggest problem I see with most of these heaters is that they require power.  For many years, I’ve been using unvented heaters that require only fuel \\u0026amp; no power.  Then I add a heat powered woodstove fan to have power free fan forced heat, without any modifications to my rig.\\u003c/p\\u003e\\n\\u003cp\\u003eMy theory is that since we need constant ventilation anyway, we don’t need to cut a hole to have a heater.  Since we can have dry heat without it being vented, I prefer that.\\u003c/p\\u003e\\n\\u003cp\\u003eI spent the winter in Northern Minnesota, and while I have been using wick type kerosene heaters, sometimes using diesel, this last winter kerosene was hard to find \\u0026amp; expensive, and the diesel wasn’t burning well in my heaters/cookers.  Maybe some different formula on the diesel, not sure…\\u003c/p\\u003e\\n\\u003cp\\u003eSo I went to the dollar store and bought everything to make a vintage style 36 wick kerosene/diesel/cooking oil heater/cooker.  Total cost was $5 or $6.  Just needed a cookie tin, a string mop for a lifetime supply of wicks, a piece of craft foam, aluminum foil, and a cake cooling rack for a cooking grill.  It might have taken me 20 minutes to assemble it.  I bought a gallon of cooking oil at Walmart for $4.50, cheaper than either kerosene or diesel in the area, and filled it up and lit about 10 of the 36 available wicks.  I then placed my woodstove fan on top, and had great fan forced, electricity free heat for under $10, that kept me toasty warm \\u0026amp; dry eveen at temperatures as low as -40°F.  That gallon of cooking oil would provide all my heating \\u0026amp; cooking needs for a whole month.  I have since built 3 more for myself, so I could have up to 4 cooking burners.  The heat is adjusted according to how many wicks are lit.\\u003c/p\\u003e\\n\\u003cp\\u003eFast, easy, cheap, simple, \\u0026amp; reliable.  We had used store bought versions of these when I was a kid in the late 40’s \\u0026amp; early 50’s.  Very impressive, \\u0026amp; fuel efficient.  I also built some for friends whose RV heaters weren’t keeping up with frigid temperatures, and they love them as much as I do.  They’re small, 8\\\&quot;x8\\\&quot;x3\\\&quot; tall, but they really pack a punch, and they provide dry odorless heat.  If you add a heat powered woodstove fan, they are really fantastic.  They’re totally silent \\u0026amp; require no external power source.\\u003c/p\\u003e\\n\\u003cp\\u003eI’m not posting this to discourage anybody from making their own choices, but as a helpful tip in case you ever find yourself in need.  It never hurts to know how to make a cheap reliable heater from easily available parts when you need one.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-03-30T22:59:23.294Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:107,\&quot;reads\&quot;:49,\&quot;readers_count\&quot;:48,\&quot;score\&quot;:569.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/2\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23615,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;ChanaS\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/c/5e9695/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-01T18:26:46.119Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eIt strikes me that as fuel prices rise, I am very happy to have the additional options that a diesel engine can potentially intake in terms of alternate fuel.\\u003c/p\\u003e\\n\\u003cp\\u003eThat said, I am interested in alternative heat sources. At my off-grid place, I have 18 cords of wood put in every fall. I’m too far away from them now…but, we had two inches of snow on the ground this morning in Amsterdam. Russia is threatening to cut off the fuel supply if he doesn’t get rubles - and I think most people are very OK with that - but we will need to think about other ways of staying warm.\\u003c/p\\u003e\\n\\u003cp\\u003eCould you possibly post a picture of your heating contraption? I like the idea, but need a visual…! \\u003cimg src=\\\&quot;https://forum.projectvanlife.com/images/emoji/apple/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eThanks in advance…\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-01T18:26:46.119Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:24,\&quot;reads\&quot;:40,\&quot;readers_count\&quot;:39,\&quot;score\&quot;:128.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Member of Van Life Academy\&quot;,\&quot;title_is_group\&quot;:false,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1018,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4923,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/3\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23617,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-01T20:31:10.772Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eI don’t have pictures, or even a camera, but perhaps I can describe it well enough so you can get a picture in your mind.\\u003c/p\\u003e\\n\\u003cp\\u003eMine is an 8\\\&quot;x8\\\&quot; square cookie tin that is about 3\\\&quot; high, but these could be built in round ones too.  The key is that you want the wicks placed at least 1\\\&quot; from the outside edge, and at least 1\\\&quot; from each other.\\u003c/p\\u003e\\n\\u003cp\\u003eCraft foam floats, and it is the wick holder, cut just slightly smaller than the inside of the container.  We wrap it in a double layer of aluminum foil to protect it from the flames.  Then we cut x’s through the aluminum foil \\u0026amp; craft foam spaced as above.  We cut out wicks from a dollar store string mop, leaving them as long as possible.  Then we feed a wick through each one of those x’s, with 1/8\\\&quot;-1/4 \\\&quot; sticking up.  Any longer and they will smoke like crazy until they burn down.\\u003c/p\\u003e\\n\\u003cp\\u003eFill the cookie tin with water first to check for leaks.  If it leaks, we’ll need to line it with plastic.  I just cut a piece out of a plastic garbage bag and place it inside and wrap it around the top and down past where the lid will go on.\\u003c/p\\u003e\\n\\u003cp\\u003eOkay, now we can put a couple of inches of cooking oil in it instead of water, and put the wicks in it.  It will need to rest for a bit so the wicks can soak up the cooking oil.  Then it is ready for use.  You regulate the heat output according to how many wicks you light.  It might smoke a little at first if the wicks are too long, but they should self shorten themselves as they burn.\\u003c/p\\u003e\\n\\u003cp\\u003eThen I use a cake cooling grill on top to hold either a pan, or my woodstove fan.  When not in use, I just put the lid on it and stick it in a drawer, I have 4 and all 4 will fit in a single drawer, 2 high and 2 deep with room left over.\\u003c/p\\u003e\\n\\u003cp\\u003eThese allow me everything from a fast boil \\u0026amp; tons of heat, all the way down to single candle power to keep food warm.  Even though I have 36 wicks in mine, I don’t think I’ve ever lit more than 10 or 12, even keeping me warm and toasty at -40°F with the heat powered woodstove fan to circulate the heat.  All with no shore power or batteries required.  They are also very fuel efficient.  A single gallon of cooking oil would last me a little over a month.  That’s $4.50 a month for all my heating, cooking, \\u0026amp; hot water needs in the frozen Northern Minnesota winter. A win/win in my book.\\u003c/p\\u003e\\n\\u003cp\\u003eI only use one for a heater, the other 3 are so I can have up to 4 cooking burners.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-01T20:35:34.052Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:48,\&quot;reads\&quot;:40,\&quot;readers_count\&quot;:39,\&quot;score\&quot;:288.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/4\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23619,\&quot;name\&quot;:null,\&quot;username\&quot;:\&quot;trumpeting_angel\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8edcca/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-01T20:40:53.978Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eHow interesting!  I have never imagined heating this way.\\u003c/p\\u003e\\n\\u003cp\\u003eAre you sure there’s no odor?  There must be some leftover gases, I imagine.  You’re still venting the van?  (I have a lung disease and have to really watch out for even the slightest pollution.)\\u003c/p\\u003e\\n\\u003cp\\u003eThanks!\\u003c/p\\u003e\\n\\u003cp\\u003eAnne\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-01T20:40:53.978Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:18,\&quot;reads\&quot;:35,\&quot;readers_count\&quot;:34,\&quot;score\&quot;:102.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1018,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4990,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/5\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23620,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-01T21:35:13.851Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eAs long as it isn’t smoking, I don’t detect any odors.  Now I was just using cheap Walmart cooking oil, but these can use many types of cooking oil, olive oil, etc. And I’ve heard they can even use diesel or kerosene.  The point is that any odors would probably be related to the fuel used, so that could be changed.\\u003c/p\\u003e\\n\\u003cp\\u003eBasically these are just multi wick liquid candles with floating wicks.\\u003c/p\\u003e\\n\\u003cp\\u003eYes, my van is always vented when in use, and usually even when not in use.  Ventilation, along with dry heat helps keep moisture \\u0026amp; mold problems away.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-01T21:35:13.851Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:17,\&quot;reads\&quot;:34,\&quot;readers_count\&quot;:33,\&quot;score\&quot;:106.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:4990,\&quot;username\&quot;:\&quot;trumpeting_angel\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8edcca/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/6\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23622,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;ChanaS\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/c/5e9695/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-02T02:04:46.668Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThat is \\u003cstrong\\u003equite\\u003c/strong\\u003e the setup…! Thanks so much for taking the time to write that out - I think I could do it from your description. When I do, I’ll take a picture and post it - and you can tell me if I’m on the right track or not.\\u003c/p\\u003e\\n\\u003cp\\u003eBTW, I always appreciate the time you take to answer and share your experience. I’ve discovered we might not always agree - but I always respect the depth of your knowledge and your willingness to share so generously.\\u003c/p\\u003e\\n\\u003cp\\u003eThank you.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-02T02:04:46.668Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:33,\&quot;readers_count\&quot;:32,\&quot;score\&quot;:71.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Member of Van Life Academy\&quot;,\&quot;title_is_group\&quot;:false,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1018,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4923,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/7\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23630,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-03T06:42:37.251Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eAwww… blush… Thanks for the kind words. \\u003cimg src=\\\&quot;https://forum.projectvanlife.com/images/emoji/apple/wink.png?v=12\\\&quot; title=\\\&quot;:wink:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:wink:\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eNothing’s right for everybody, and it’s okay to not always agree.  That’s how we learn, and knowledge is power.  What seems right or wrong for us today, could change in the future, and you just never know.\\u003c/p\\u003e\\n\\u003cp\\u003eKnowing extra options for if or when they’re needed never hurts.  Yesterday I stumbled upon a lady in a ditch, and as luck would have it, my tow strap never got returned the last time I loaned it out, and all I had was a 100 foot length of dollar store rope.  Not nearly strong enough for the task needed…\\u003c/p\\u003e\\n\\u003cp\\u003eSo I tripled the rope over, and did a chain stitch type thing to make a ~10 foot tow rope which would hopefully be much stronger, and it worked!  I read that tip like 20 years ago, and 20 years later it saved the day.  I think knowledge \\u0026amp; choices are often under appreciated.\\u003c/p\\u003e\\n\\u003cp\\u003ePictures would be GREAT!  That’s one category I’ve never been good at.  Digital cameras, smart phones, and touch screens don’t seem to like me.  I’m like a ghost to them for some reason.  I can tap em till the cows come home, and they just ignore me.  Voice recognition doesn’t seem to work well for me either.  At least the keyboard on my laptop \\u0026amp; keypad on my flip phone work hehe.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:8,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-03T06:42:37.251Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:11,\&quot;reads\&quot;:29,\&quot;readers_count\&quot;:28,\&quot;score\&quot;:75.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;ch st_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:25,\&quot;readers_count\&quot;:24,\&quot;score\&quot;:45.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4990,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/9\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23649,\&quot;name\&quot;:null,\&quot;username\&quot;:\&quot;DodgeLife\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/d/90ced4/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-04T18:02:39.285Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eDiesel heaters only run on diesel fuel.  They can be used in any vehicle or even stand alone with no vehicle at all.\\u003c/p\\u003e\\n\\u003cp\\u003eNot a dumb question at all.  we all start somewhere \\u003cimg src=\\\&quot;https://forum.projectvanlife.com/images/emoji/apple/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot;\\u003e\\u003cbr\\u003e\\nThere are numerous alternatives.  Buddy heaters for example.\\u003c/p\\u003e\\n\\u003cp\\u003eIf you’d rather build something yourself there are a few posts above related to that too.\\u003c/p\\u003e\\n\\u003cp\\u003eHappy Trails!\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:10,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-04T18:02:39.285Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:9,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:4,\&quot;reads\&quot;:27,\&quot;readers_count\&quot;:26,\&quot;score\&quot;:45.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:4990,\&quot;username\&quot;:\&quot;trumpeting_angel\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8edcca/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4941,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_vie \&quot;/letter_avatar_proxy/v4/letter/d/90ced4/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4990,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/11\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23653,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-04T20:12:03.744Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eWith proper necessary ventilation, fumes should really never be a problem because they will be vented out almost immediately.\\u003c/p\\u003e\\n\\u003cp\\u003eI cook inside my van every day, and use unvented heaters constantly during frigid winters for the last few years, and fumes or odors are very brief before they go away.  Even with vented heaters, it isn’t uncommon to get fumes for a little bit upon startup or shutdown, but nothing that proper ventilation can’t take care of almost immediately.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:12,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-04T20:12:03.744Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:11,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:6,\&quot;reads\&quot;:28,\&quot;readers_count\&quot;:27,\&quot;score\&quot;:50.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:4990,\&quot;username\&quot;:\&quot;trumpeting_angel\&quot;,\&quot;name\&quot;:null,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/t/8edcca/{size}.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/12\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23660,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Bretly\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/b/b5a626/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-05T11:19:38.506Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWe installed a Webasto and it’s decidedly one of the better accessories we bought for the van.  No more shopping for alternative fuel sources, moisture buildup or getting out of bed to mess with a propane heater.\\u003c/p\\u003e\\n\\u003cp\\u003eWe looked at the Chinese knockoffs, but then I watched a youtube video with a breakdown of the two and there are definitely build quality differences.  Whether that matters or not I think has yet to be seen as the Chinese ones are still fairly new.\\u003c/p\\u003e\\n\\u003cp\\u003eHave you figured out how to set them up for altitude yet?  The webasto is a actually a fairly simple process.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:13,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-06T10:14:22.127Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:10,\&quot;reads\&quot;:28,\&quot;readers_count\&quot;:27,\&quot;score\&quot;:55.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;Founding Member \&quot;,\&quot;title_is_group\&quot;:false,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:589,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/13\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23664,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Tedski\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/tedski/{size}/5478_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-06T13:49:15.408Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eCan you tell me why you bought three heaters? With taxes and freight you probably spent $600 -  $800? Do you carry a spare with you?   How much is reliability worth  in the middle of nowhere  at - 15F with no heat?  Whats safety worth while your’re sleeping with a Chinese heater running?\\u003cbr\\u003e\\nThese are reasons why people buy brand name heaters. I have a Planar high altitude heater. It was $900.  I only purchased one, I only installed one, three years ago, and it hasn’t failed me once.  I believe some things you can buy on the cheap. Safety and reliability items are ones you can’t.  Hope you get my drift!\\u003c/p\\u003e\\n\\u003cp\\u003eThese are the questions i asked myself\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:14,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-06T13:49:15.408Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:12,\&quot;reads\&quot;:28,\&quot;readers_count\&quot;:27,\&quot;score\&quot;:90.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:5011,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/14\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23666,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-06T20:10:35.771Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings \\u0026amp; Welcome!\\u003c/p\\u003e\\n\\u003cp\\u003eThis is kind of where I’m at, except even simpler.  The vintage style heater/cooker I used last winter in the frigid frozen North, is dirt cheap to build, uses no electricity, and has basically nothing that can go wrong with it.  It’s basically a liquid candle heater/cooker with many wicks, that can use cooking oil, diesel, or kerosene.\\u003c/p\\u003e\\n\\u003cp\\u003eYou adjust the temperature according to how many wicks you light, and a dollar store string mop will give you a lifetime supply of wicks.  Nice reliable dry heat, that’s portable and requires no vehicle modifications.\\u003c/p\\u003e\\n\\u003cp\\u003eWith the addition of a heat powered woodstove fan, you can have electricity free fan forced heat, or cooling powered by only a single wick lit.  With a spray bottle to mist yourself \\u0026amp; the fan, you can also stay cool even in the hottest weather.\\u003c/p\\u003e\\n\\u003cp\\u003eWhile my laptop \\u0026amp; phone need power to charge them, both are basically luxuries, but if I can heat, cook, have lights, etc. that are all electricity free, even if just for backups, I feel well prepared.\\u003c/p\\u003e\\n\\u003cp\\u003eAs a kid, we tent camped in all weather conditions, comfortably.  Blazing hot to well below zero, we were comfortable without any electricity at all.  While I’m not opposed to more modern conveniences, being prepared for when the power goes out, brings me a lot of comfort \\u0026amp; peace of mind.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:15,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-06T20:10:35.771Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:14,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:1,\&quot;reads\&quot;:29,\&quot;readers_count\&quot;:28,\&quot;score\&quot;:10.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:5011,\&quot;username\&quot;:\&quot;Tedski\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/tedski/{size}/5478_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/15\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23669,\&quot;name\&quot;:null,\&quot;username\&quot;:\&quot;DodgeLife\&quot;,\&quot;avatar_template\&quot;:\&quot;/letter_avatar_proxy/v4/letter/d/90ced4/{size}.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-06T23:50:20.676Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eSome may be hard pressed for money and cannot afford a $900 heater.  I’d just like to add that one should not fear them just because they cost considerably less. Most everything you own today is made in China.   I have 3 of different sizes of Chinese diesel heaters and for different purposes.  For me it’s the golden ticket to being comfortable in the cold. There are millions of the Chinese diesel heaters in use it seems from all the forums that talk about them.\\u003cbr\\u003e\\nI have not read of a single case of CO poisoning from them to date.  To each his own.  Do your own research and you decide what’s right for you.\\u003c/p\\u003e\\n\\u003cp\\u003eTake reasonable precautions of course.   For example have multiple CO detectors.  That should be the case regardless of what you use for heat I would say.\\u003cbr\\u003e\\nWith over two years of use on them now and hundreds of hours they have been 100% reliable and it costs me about 30 cents a night to stay cozy warm and dry (oops…that was before gas prices went crazy, now it’s almost 60 cents a night…\\u003c/p\\u003e\\n\\u003cp\\u003eI’m not a fan of open flames in a vehicle living space unless it’s a woodstove designed for it…  It’s just me.  Especially when there’s any kind of hot or flammable liquid associated with it. It also removes oxygen from the air and so you must leave windows open.   If I had no other choice I’m sure I’d rather have that than freeze.\\u003c/p\\u003e\\n\\u003cp\\u003eVan_Dweller this is not to in any way diminish your choice.  If it works for you then it must be the right choice for you and will likely work for others as well.  Different strokes for different folks the saying goes.\\u003c/p\\u003e\\n\\u003cp\\u003eTedski,\\u003cbr\\u003e\\nThey are different sizes, different configurations for different situations.  And as a backup.\\u003cbr\\u003e\\nNot to mention they were all shipped free.  I think I have $340 total in all 3 of them combined.\\u003cbr\\u003e\\nI love my diesel heaters.  With the simple push of a button my Van is 70F degrees in 15F weather in minutes.  No mess no fuss.\\u003c/p\\u003e\\n\\u003cp\\u003eJust my 2 cents.  YMMV and of course, diesel heaters are not for everyone.\\u003c/p\\u003e\\n\\u003cp\\u003eHappy Trails !\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:16,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-06T23:50:20.676Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:14,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:14,\&quot;reads\&quot;:29,\&quot;readers_count\&quot;:28,\&quot;score\&quot;:90.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:null,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:5011,\&quot;username\&quot;:\&quot;Tedski\&quot;,\&quot;name\&quot;:\&quot;\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/tedski/{size}/5478_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:4941,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:2,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/16\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23670,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Tedski\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/tedski/{size}/5478_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-07T00:01:10.345Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eVery interesting. Unfortunately I can’t seem to  understand exactly what you’re doing? If I read it correctly you have  36 wicks positioned in a large can of cooking oil and you light then to produce heat. The amount of heat is  regulated by the number of wicks you light? I’d  be interested in seeing pictures pictures of your set up?  A single flame produced by a wick burning a low flash point fuel like cooking oil or kerosene produces only about 85 BTU. This makes  the total BTU’s for all 36 wicks ito be about 3100.  That’s not a lot of heat. It sure wouldn’t  keep my van warm at 25 F?  Also I wonder how safe and how much soot is produced?\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:17,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-07T00:01:10.345Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:2,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:7,\&quot;reads\&quot;:24,\&quot;readers_count\&quot;:23,\&quot;score\&quot;:39.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;reply_to_user\&quot;:{\&quot;id\&quot;:1018,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:5011,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/17\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23674,\&quot;name\&quot;:\&quot;Van Dweller\&quot;,\&quot;username\&quot;:\&quot;Van_Dweller\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/van_dweller/{size}/7052_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-07T02:10:42.589Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreetings!\\u003c/p\\u003e\\n\\u003cp\\u003eYes, it is a 8\\\&quot;x8\\\&quot; square cookie tin, and the wicks are spaced 1\\\&quot; apart, and 1\\\&quot; in from the walls to give you a 6x6 grid of wicks.\\u003c/p\\u003e\\n\\u003cp\\u003eBTU’s is highly questionable, the 3 wick UCO Candelier claims to produce 5k BTU…  What I can tell you is that at -40°F last winter, 10 wicks lit kept me as toasty as my 23k BTU kerosene heater would on low, and that was with both front windows cracked about an inch, and no added insulation or window coverings in a hightop extended van with factory windows all around.  8-10 wicks lit seems about like a stove burner on high.\\u003c/p\\u003e\\n\\u003cp\\u003eSorry, no pics, but there’s a pretty detailed description earlier in this thread.\\u003c/p\\u003e\\n\\u003cp\\u003eThese are actually my backup plan, but I wanted to make sure they’d work as expected, and they actually exceeded my expectations for both heating \\u0026amp; cooking, and proved to be reliable enough to use as even primary systems.\\u003c/p\\u003e\\n\\u003cp\\u003eIt burns clean as long as the wick height is short, with no soot or pot blackening, and I would say it’s as safe or safer than any other type of portable heater or campstove.\\u003c/p\\u003e\\n\\u003cp\\u003eCheers!\\u003c/p\\u003e\\n\\u003chr\\u003e\\n\\u003cdiv align=\\\&quot;center\\\&quot;\\u003e\\u003cb\\u003e\\\&quot;Be the reason someone smiles today!\\\&quot; ~ Van_Dweller\\n\\u003c/b\\u003e\\u003c/div\\u003e\\u003cbr\\u003e\\u003cbr\\u003e\&quot;,\&quot;post_number\&quot;:18,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-07T02:10:42.589Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3,\&quot;reads\&quot;:24,\&quot;readers_count\&quot;:23,\&quot;score\&quot;:24.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;Van Dweller\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:1018,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:3,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false,\&quot;post_url\&quot;:\&quot;/t/cheap-vs-expensive-diesel-heaters/8368/18\&quot;,\&quot;can_accept_answer\&quot;:false,\&quot;can_unaccept_answer\&quot;:false,\&quot;accepted_answer\&quot;:false,\&quot;topic_accepted_answer\&quot;:null},{\&quot;id\&quot;:23675,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;Tedski\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/forum.projectvanlife.com/tedski/{size}/5478_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-04-07T03:37:12.916Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWindows cracked open,  no covering on the widows and -40F. First do you realize  how cold -40F is? That’s 72 degrees below the freezing point of water.  At that temp, just having the windows open,   there’s absolutely no way 10 candles would even begin to warm up  the air coming in!  Are you sure the temp outside wasn’t 41?   That’s  possible.  You should  look up what a BTU is and then you’ll see any three candles couldn’t generate 3000 BTU’s if they were burning in pure oxygen!   Last but not least its unbelievably dangerous and you should tell people it is. Unfortunately you wont.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:19,\&quot;post_type\&quot;:1,\&quot;posts_count\&quot;:25,\&quot;updated_at\&quot;:\&quot;2022-04-07T03:37:12.916Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:3,\&quot;reads\&quot;:23,\&quot;readers_count\&quot;:22,\&quot;score\&quot;:39.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:8368,\&quot;topic_slug\&quot;:\&quot;cheap-vs-expensive-diesel-heaters\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;flair_group_id\&quot;:null,\&quot;badges_granted\&quot;:[],\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_see_hidden_post\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:\&quot;\&quot;,\&quot;bookmarked\&quot;:fal               <p>Just watched a video where a cheap (under $200 Chinese Copy) is compared to an Espar Diesel heater.</p>
<p>The Espar is about $1400 US compared to the Chinese copy about $130 US</p>
<p>I have 3 Chinese diesel heaters.  I have had only one problem with one of them and that was a poorly made fuel tank, not the heater itself.   I never have any odors of any kind whatsoever from any of them except maybe on initial startup and it’s rare and very slight if at all.</p>
<p>They have been 100% reliable and kept me comfortable on some cold winter nights.  I found that my 5Kw unit is too much for my small van even on low.   So I also have a 2Kw unit that seems about perfect even though I still keep a window open slightly on nights down to 10F because it puts out plenty of heat even on low.  I do have custom made window insulation covers and that helps as well.</p>
<p>My (opinion) is that if you have trouble with your Chinese diesel heater you either got a bad one and should have returned it early on, or you just don’t quite know how to use it.  I also have buddy heaters and they are good for their purpose but I much prefer the diesel heater in the van for a number of reasons.</p>
<p>If the Chinese had not made affordable copies, I would likely have never owned a diesel heater.<br>
The only thing that could make them better for me is if they were made in America for not too much more.</p>

              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-03-30T22:59:23Z' class='post-time'>

            <div class='post' itemprop='text'>
              <p>Greetings!</p>
<p>The biggest problem I see with most of these heaters is that they require power.  For many years, I’ve been using unvented heaters that require only fuel &amp; no power.  Then I add a heat powered woodstove fan to have power free fan forced heat, without any modifications to my rig.</p>
<p>My theory is that since we need constant ventilation anyway, we don’t need to cut a hole to have a heater.  Since we can have dry heat without it being vented, I prefer that.</p>
<p>I spent the winter in Northern Minnesota, and while I have been using wick type kerosene heaters, sometimes using diesel, this last winter kerosene was hard to find &amp; expensive, and the diesel wasn’t burning well in my heaters/cookers.  Maybe some different formula on the diesel, not sure…</p>
<p>So I went to the dollar store and bought everything to make a vintage style 36 wick kerosene/diesel/cooking oil heater/cooker.  Total cost was $5 or $6.  Just needed a cookie tin, a string mop for a lifetime supply of wicks, a piece of craft foam, aluminum foil, and a cake cooling rack for a cooking grill.  It might have taken me 20 minutes to assemble it.  I bought a gallon of cooking oil at Walmart for $4.50, cheaper than either kerosene or diesel in the area, and filled it up and lit about 10 of the 36 available wicks.  I then placed my woodstove fan on top, and had great fan forced, electricity free heat for under $10, that kept me toasty warm &amp; dry eveen at temperatures as low as -40°F.  That gallon of cooking oil would provide all my heating &amp; cooking needs for a whole month.  I have since built 3 more for myself, so I could have up to 4 cooking burners.  The heat is adjusted according to how many wicks are lit.</p>
<p>Fast, easy, cheap, simple, &amp; reliable.  We had used store bought versions of these when I was a kid in the late 40’s &amp; early 50’s.  Very impressive, &amp; fuel efficient.  I also built some for friends whose RV heaters weren’t keeping up with frigid temperatures, and they love them as much as I do.  They’re small, 8"x8"x3" tall, but they really pack a punch, and they provide dry odorless heat.  If you add a heat powered woodstove fan, they are really fantastic.  They’re totally silent &amp; require no external power source.</p>
<p>I’m not posting this to discourage anybody from making their own choices, but as a helpful tip in case you ever find yourself in need.  It never hurts to know how to make a cheap reliable heater from easily available parts when you need one.</p>
<p>Cheers!</p>

              <p>It strikes me that as fuel prices rise, I am very happy to have the additional options that a diesel engine can potentially intake in terms of alternate fuel.</p>
<p>That said, I am interested in alternative heat sources. At my off-grid place, I have 18 cords of wood put in every fall. I’m too far away from them now…but, we had two inches of snow on the ground this morning in Amsterdam. Russia is threatening to cut off the fuel supply if he doesn’t get rubles - and I think most people are very OK with that - but we will need to think about other ways of staying warm.</p>

            <div class='post' itemprop='text'>
              <p>Greetings!</p>
<p>I don’t have pictures, or even a camera, but perhaps I can describe it well enough so you can get a picture in your mind.</p>
<p>Mine is an 8"x8" square cookie tin that is about 3" high, but these could be built in round ones too.  The key is that you want the wicks placed at least 1" from the outside edge, and at least 1" from each other.</p>
<p>Craft foam floats, and it is the wick holder, cut just slightly smaller than the inside of the container.  We wrap it in a double layer of aluminum foil to protect it from the flames.  Then we cut x’s through the aluminum foil &amp; craft foam spaced as above.  We cut out wicks from a dollar store string mop, leaving them as long as possible.  Then we feed a wick through each one of those x’s, with 1/8"-1/4 " sticking up.  Any longer and they will smoke like crazy until they burn down.</p>
<p>Fill the cookie tin with water first to check for leaks.  If it leaks, we’ll need to line it with plastic.  I just cut a piece out of a plastic garbage bag and place it inside and wrap it around the top and down past where the lid will go on.</p>
<p>Okay, now we can put a couple of inches of cooking oil in it instead of water, and put the wicks in it.  It will need to rest for a bit so the wicks can soak up the cooking oil.  Then it is ready for use.  You regulate the heat output according to how many wicks you light.  It might smoke a little at first if the wicks are too long, but they should self shorten themselves as they burn.</p>
<p>Then I use a cake cooling grill on top to hold either a pan, or my woodstove fan.  When not in use, I just put the lid on it and stick it in a drawer, I have 4 and all 4 will fit in a single drawer, 2 high and 2 deep with room left over.</p>
<p>These allow me everything from a fast boil &amp; tons of heat, all the way down to single candle power to keep food warm.  Even though I have 36 wicks in mine, I don’t think I’ve ever lit more than 10 or 12, even keeping me warm and toasty at -40°F with the heat powered woodstove fan to circulate the heat.  All with no shore power or batteries required.  They are also very fuel efficient.  A single gallon of cooking oil would last me a little over a month.  That’s $4.50 a month for all my heating, cooking, &amp; hot water needs in the frozen Northern Minnesota winter. A win/win in my book.</p>
<p>I only use one for a heater, the other 3 are so I can have up to 4 cooking burners.</p>
<p>Cheers!</p>

          <div id='post_13' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Bretly'><span itemprop='name'>Bretly</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-05T11:19:38Z' class='post-time'>
                    April 5, 2022, 11:19am
                  </time>
                  <meta itemprop='dateModified' content='2022-04-06T10:14:21Z'>
              <span itemprop='position'>13</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>We installed a Webasto and it’s decidedly one of the better accessories we bought for the van.  No more shopping for alternative fuel sources, moisture buildup or getting out of bed to mess with a propane heater.</p>
<p>We looked at the Chinese knockoffs, but then I watched a youtube video with a breakdown of the two and there are definitely build quality differences.  Whether that matters or not I think has yet to be seen as the Chinese ones are still fairly new.</p>
<p>Have you figured out how to set them up for altitude yet?  The webasto is a actually a fairly simple process.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />

            </div>


            
          </div>
          <div id='post_14' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Tedski'><span itemprop='name'>Tedski</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-06T13:49:15Z' class='post-time'>
                    April 6, 2022,  1:49pm
                  </time>
                  <meta itemprop='dateModified' content='2022-04-06T13:49:15Z'>
              <span itemprop='position'>14</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Can you tell me why you bought three heaters? With taxes and freight you probably spent $600 -  $800? Do you carry a spare with you?   How much is reliability worth  in the middle of nowhere  at - 15F with no heat?  Whats safety worth while your’re sleeping with a Chinese heater running?<br>
These are reasons why people buy brand name heaters. I have a Planar high altitude heater. It was $900.  I only purchased one, I only installed one, three years ago, and it hasn’t failed me once.  I believe some things you can buy on the cheap. Safety and reliability items are ones you can’t.  Hope you get my drift!</p>
<p>These are the questions i asked myself</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="1" />
              <span class='post-likes'>1 Like</span>
            </div>


            
          </div>
          <div id='post_15' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Van_Dweller'><span itemprop='name'>Van_Dweller</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-06T20:10:35Z' class='post-time'>
                    April 6, 2022,  8:10pm
                  </time>
                  <meta itemprop='dateModified' content='2022-04-06T20:10:35Z'>
              <span itemprop='position'>15</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Greetings &amp; Welcome!</p>
<p>This is kind of where I’m at, except even simpler.  The vintage style heater/cooker I used last winter in the frigid frozen North, is dirt cheap to build, uses no electricity, and has basically nothing that can go wrong with it.  It’s basically a liquid candle heater/cooker with many wicks, that can use cooking oil, diesel, or kerosene.</p>
<p>You adjust the temperature according to how many wicks you light, and a dollar store string mop will give you a lifetime supply of wicks.  Nice reliable dry heat, that’s portable and requires no vehicle modifications.</p>
<p>With the addition of a heat powered woodstove fan, you can have electricity free fan forced heat, or cooling powered by only a single wick lit.  With a spray bottle to mist yourself &amp; the fan, you can also stay cool even in the hottest weather.</p>
<p>While my laptop &amp; phone need power to charge them, both are basically luxuries, but if I can heat, cook, have lights, etc. that are all electricity free, even if just for backups, I feel well prepared.</p>
<p>As a kid, we tent camped in all weather conditions, comfortably.  Blazing hot to well below zero, we were comfortable without any electricity at all.  While I’m not opposed to more modern conveniences, being prepared for when the power goes out, brings me a lot of comfort &amp; peace of mind.</p>
<p>Cheers!</p>
<hr>
<div align="center"><b>"Be the reason someone smiles today!" ~ Van_Dweller
</b></div><br><br>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />
              <span class='post-likes'></span>
            </div>


            
          </div>
          <div id='post_16' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/DodgeLife'><span itemprop='name'>DodgeLife</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-06T23:50:20Z' class='post-time'>
                    April 6, 2022, 11:50pm
                  </time>
                  <meta itemprop='dateModified' content='2022-04-06T23:50:20Z'>
              <span itemprop='position'>16</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Some may be hard pressed for money and cannot afford a $900 heater.  I’d just like to add that one should not fear them just because they cost considerably less. Most everything you own today is made in China.   I have 3 of different sizes of Chinese diesel heaters and for different purposes.  For me it’s the golden ticket to being comfortable in the cold. There are millions of the Chinese diesel heaters in use it seems from all the forums that talk about them.<br>
I have not read of a single case of CO poisoning from them to date.  To each his own.  Do your own research and you decide what’s right for you.</p>
<p>Take reasonable precautions of course.   For example have multiple CO detectors.  That should be the case regardless of what you use for heat I would say.<br>
With over two years of use on them now and hundreds of hours they have been 100% reliable and it costs me about 30 cents a night to stay cozy warm and dry (oops…that was before gas prices went crazy, now it’s almost 60 cents a night…</p>
<p>I’m not a fan of open flames in a vehicle living space unless it’s a woodstove designed for it…  It’s just me.  Especially when there’s any kind of hot or flammable liquid associated with it. It also removes oxygen from the air and so you must leave windows open.   If I had no other choice I’m sure I’d rather have that than freeze.</p>
<p>Van_Dweller this is not to in any way diminish your choice.  If it works for you then it must be the right choice for you and will likely work for others as well.  Different strokes for different folks the saying goes.</p>
<p>Tedski,<br>
They are different sizes, different configurations for different situations.  And as a backup.<br>
Not to mention they were all shipped free.  I think I have $340 total in all 3 of them combined.<br>
I love my diesel heaters.  With the simple push of a button my Van is 70F degrees in 15F weather in minutes.  No mess no fuss.</p>
<p>Just my 2 cents.  YMMV and of course, diesel heaters are not for everyone.</p>
<p>Happy Trails !</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="1" />

          </div>
          <div id='post_17' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Tedski'><span itemprop='name'>Tedski</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-07T00:01:10Z' class='post-time'>
                    April 7, 2022, 12:01am
                  </time>
                  <meta itemprop='dateModified' content='2022-04-07T00:01:10Z'>
              <span itemprop='position'>17</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Very interesting. Unfortunately I can’t seem to  understand exactly what you’re doing? If I read it correctly you have  36 wicks positioned in a large can of cooking oil and you light then to produce heat. The amount of heat is  regulated by the number of wicks you light? I’d  be interested in seeing pictures pictures of your set up?  A single flame produced by a wick burning a low flash point fuel like cooking oil or kerosene produces only about 85 BTU. This makes  the total BTU’s for all 36 wicks ito be about 3100.  That’s not a lot of heat. It sure wouldn’t  keep my van warm at 25 F?  Also I wonder how safe and how much soot is produced?</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>
              <meta itemprop="userInteractionCount" content="0" />

          <div id='post_18' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Van_Dweller'><span itemprop='name'>Van_Dweller</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-07T02:10:42Z' class='post-time'>
                    April 7, 2022,  2:10am
                  </time>
                  <meta itemprop='dateModified' content='2022-04-07T02:10:42Z'>
              <span itemprop='position'>18</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Greetings!</p>
<p>Yes, it is a 8"x8" square cookie tin, and the wicks are spaced 1" apart, and 1" in from the walls to give you a 6x6 grid of wicks.</p>
<p>BTU’s is highly questionable, the 3 wick UCO Candelier claims to produce 5k BTU…  What I can tell you is that at -40°F last winter, 10 wicks lit kept me as toasty as my 23k BTU kerosene heater would on low, and that was with both front windows cracked about an inch, and no added insulation or window coverings in a hightop extended van with factory windows all around.  8-10 wicks lit seems about like a stove burner on high.</p>
<p>Sorry, no pics, but there’s a pretty detailed description earlier in this thread.</p>
<p>These are actually my backup plan, but I wanted to make sure they’d work as expected, and they actually exceeded my expectations for both heating &amp; cooking, and proved to be reliable enough to use as even primary systems.</p>
<p>It burns clean as long as the wick height is short, with no soot or pot blackening, and I would say it’s as safe or safer than any other type of portable heater or campstove.</p>
<p>Cheers!</p>
<hr>
<div align="center"><b>"Be the reason someone smiles today!" ~ Van_Dweller
</b></div><br><br>
            </div>

          <div id='post_19' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Tedski'><span itemprop='name'>Tedski</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-07T03:37:12Z' class='post-time'>
                    April 7, 2022,  3:37am
                  </time>
                  <meta itemprop='dateModified' content='2022-04-07T03:37:12Z'>
              <span itemprop='position'>19</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Windows cracked open,  no covering on the widows and -40F. First do you realize  how cold -40F is? That’s 72 degrees below the freezing point of water.  At that temp, just having the windows open,   there’s absolutely no way 10 candles would even begin to warm up  the air coming in!  Are you sure the temp outside wasn’t 41?   That’s  possible.  You should  look up what a BTU is and then you’ll see any three candles couldn’t generate 3000 BTU’s if they were burning in pure oxygen!   Last but not least its unbelievably dangerous and you should tell people it is. Unfortunately you wont.</p>
            </div>

            <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">
              <meta itemprop="interactionType" content="http://schema.org/LikeAction"/>

          <div id='post_20' itemprop='comment' itemscope itemtype='http://schema.org/Comment' class='topic-body crawler-post'>
            <div class='crawler-post-meta'>
              <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
                <a itemprop="url" rel='nofollow' href='https://forum.projectvanlife.com/u/Van_Dweller'><span itemprop='name'>Van_Dweller</span></a>
                
              </span>



              <span class="crawler-post-infos">
                  <time itemprop='datePublished' datetime='2022-04-09T01:09:42Z' class='post-time'>
                    April 9, 2022,  1:09am
                  </time>
                  <meta itemprop='dateModified' content='2022-04-09T01:09:42Z'>
              <span itemprop='position'>20</span>
              </span>
            </div>
            <div class='post' itemprop='text'>
              <p>Greetings!</p>
<p>Real life doesn’t feel a need to comply with anybody else’s rules, needs, or expectations.  Life is fluid and constantly changing.  Yesterday’s reality, might be obsolete today, but that doesn’t mean it doesn’t still work.</p>
<p>Every day we look at things and say “That’s Impossible!” or ask ourselves “How is that possible?”, yet it happened.  It didn’t care about the odds, the probability, physics, or anything else, yet it happened.  Such is real life.  No argument or explanation can claim it didn’t happen, when it obviously did.</p>
<p>Candle heating &amp; cooking dates way back, and is still in daily use in many parts of the world.  Millions of people have proven the technique works and they depend upon it.</p>
<p>A vehicle typically holds in heat quite well, even with the windows cracked.  It might take a little extra heat to compensate for the open windows, but it’s still easily doable.</p>
<p>Many nomads do things much more dangerous than these heaters/cookers every day, but safety should always be practiced.</p>
<p>Cheers!</p>
<hr>
<div align="center"><b>"Be the reason someone smiles today!" ~ Van_Dweller
</b></div><br><br>
